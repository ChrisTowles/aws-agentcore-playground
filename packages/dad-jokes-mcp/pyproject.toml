[project]
name = "dad-jokes-mcp"
version = "0.0.1"
description = "A dad jokes MCP server for AWS AgentCore exploration"
authors = [{ name = "Chris Towles", email = "chris.towles.dev01@gmail.com" }]
readme = "README.md"
keywords = ['python', 'cli', 'dad-jokes', 'mcp']
requires-python = ">=3.13,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/ChrisTowles/aws-agentcore-playground"
Repository = "https://github.com/ChrisTowles/aws-agentcore-playground"
Documentation = "https://github.com/ChrisTowles/aws-agentcore-playground"

[project.scripts]
dad-jokes-mcp = "dad_jokes_mcp.mcp_server:main"
djmcp = "dad_jokes_mcp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dad_jokes_mcp"]
