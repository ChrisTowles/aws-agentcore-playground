[project]
name = "towles-tool"
version = "0.0.1"
description = "explore what is possible in AWS agentcore"
authors = [{ name = "Chris Towles", email = "chris.towles.dev01@gmail.com" }]
readme = "README.md"
keywords = ['python', 'cli', 'towles']
requires-python = ">=3.9,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "platformdirs>=4.3.8",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.urls]
Homepage = "https://ChrisTowles.github.io/towles-tool/"
Repository = "https://github.com/ChrisTowles/towles-tool"
Documentation = "https://ChrisTowles.github.io/towles-tool/"

[project.scripts]
agent-start = "towles_tool.cli:app"
towles-tool = "towles_tool.cli:app"
tt = "towles_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/towles_tool"]